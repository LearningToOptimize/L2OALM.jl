name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
      id-token: write # OIDC token for Codecov uploads
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # LTS
          - '1'    # latest release
        os:
          - ubuntu-latest
        arch:
          - x64
    env:
      JULIA_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # L2OCore and BatchNLPKernels are not registered yet and Julia 1.10 ignores
      # [sources]; the script builds the test environment from test/Project.toml
      # and adds them by URL (and this package by path).
      - name: Set up the test environment
        run: julia --color=yes .github/ci/setup_test_env.jl test_env
      - name: Run tests
        run: julia --color=yes --project=test_env --code-coverage=user --check-bounds=yes test/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
