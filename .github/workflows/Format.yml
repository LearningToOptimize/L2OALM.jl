name: Format
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Check formatting (style in .JuliaFormatter.toml)
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = "1"))
          using JuliaFormatter
          if !format(["src", "ext", "test", "docs", "examples"]; overwrite = false)
              run(`git diff`)
              error("Some files are not formatted; run `using JuliaFormatter; format(\".\")`.")
          end
